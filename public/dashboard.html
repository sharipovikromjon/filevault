<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FileVault - Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-page">
    <nav class="navbar">
      <span class="brand">FileVault</span>
      <div class="nav-links">
        <a href="upload.html">Upload File</a>
        <button id="logout-btn" class="btn-ghost">Logout</button>
      </div>
    </nav>

    <main class="container">
      <h2>My Files</h2>

      <table class="files-table" id="files-table">
        <thead>
          <tr>
            <th>Filename</th>
            <th>Size</th>
            <th>Last Modified</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="files-body">
          <tr>
            <td colspan="5">Loading...</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script>
      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleString();
      }

      function statusBadge(status) {
        const colors = {
          synced: "badge-green",
          uploading: "badge-blue",
          processing: "badge-yellow",
          error: "badge-red",
          deleted: "badge-gray",
        };

        return `<span class="badge ${colors[status] || "badge-gray"}">${status}</span>`;
      }

      async function loadFiles() {
        const tbody = document.getElementById("files-body");
        try {
          const res = await fetch("/api/files");
          if (res.status === 401) {
            window.location.href = "/";
            return;
          }

          const data = await res.json();

          if (data.files.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5">No files yet. Upload one!</td></tr>';
            return;
          }

          tbody.innerHTML = data.files
            .map(
              (f) => `
					<tr id="row-${f.id}">
						<td>${f.filename}</td>
						<td>${formatBytes(f.file_size)}</td>
						<td>${formatDate(f.last_modified)}</td>
						<td>${statusBadge(f.status)}</td>
						<td class="actions">
							<button class="btn-sm btn-secondary" onclick="editDescription('${f.id}', '${(f.description || "").replace(/'/g, "&#39;")}')">Edit</button>
							<button class="btn-sm btn-danger" onclick="deleteFile('${f.id}')">Delete</button>
						</td>
					</tr>
				`,
            )
            .join("");
        } catch (err) {
          tbody.innerHTML =
            '<tr><td colspan="5">Error loading files.</td></tr>';
        }
      }

      async function editDescription(fileId, currentDesc) {
        const newDesc = prompt("Edit description:", currentDesc);
        if (newDesc === null) return;

        const formData = new FormData();
        formData.append("description", newDesc);

        const res = await fetch(`/api/files/${fileId}`, {
          method: "PUT",
          body: formData,
        });

        if (res.ok) {
          loadFiles();
        } else {
          alert("Failed to update file.");
        }
      }

      async function deleteFile(fileId) {
        if (!confirm("Are you sure you want to delete this file?")) return;

        const res = await fetch(`/api/files/${fileId}`, { method: "DELETE" });

        if (res.ok) {
          loadFiles();
        } else {
          alert("Failed to delete file.");
        }
      }

      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", { method: "POST" });
          window.location.href = "/";
        });

      loadFiles();
      setInterval(loadFiles, 10000);
    </script>
  </body>
</html>
